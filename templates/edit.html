{% extends "base.html" %}

{% block title %}イベントの編集{% endblock %}

{% block content %}
<h2>イベントの編集</h2>
<form action="{{ url_for('edit_event', event_id=event.id) }}" method="POST">
  <div class="form-group">
    <label for="title">タイトル:</label>
    <input type="text" id="title" name="title" class="form-control" value="{{ event.title }}" required>
  </div>
  <div class="form-group">
    <label for="date">日付 (例: YYYY-MM-DD):</label>
    <input type="text" id="date" name="date" class="form-control" value="{{ event.date }}" required>
  </div>
  <div class="form-group">
    <label for="description">説明:</label>
    <textarea id="description" name="description" class="form-control">{{ event.description }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">更新する</button>
</form>
{% endblock %}
